# Project Identifier Registry — controlled update candidate
# This file is NOT authoritative until the required governance roles adopt it,
# an independent verifier verifies the exact committed bytes, and the recorded
# confirming authority confirms the allocation.
# A Git commit proves that bytes were committed; it does not, by itself, allocate an identifier.

schema_version: "1.1"
registry:
  name: "Koware / IAPD Project Identifier Registry"
  canonical_path: "IAPD/assets-records/pbim-identifier-registry.yaml"
  repository: "https://github.com/cupidblack/Koware_Management"
  branch: "main"
  supplied_commit: "e845affeebd38f15ee6bc31181d4c707197e3357"
  status: "COMMITTED_CANDIDATE_PENDING_INDEPENDENT_VERIFICATION_AND_GOVERNANCE_CONFIRMATION"
  purpose: >-
    Controlled record of project and artifact identifier requests, reservations,
    allocations, aliases, retirements, and allocation evidence. An identifier
    is allocated only after the defined protocol has been completed and its
    evidence is recorded against immutable commit and content-hash references.
  authority:
    constitutional_authority: "CA-ABSENT"
    human_project_authority: "UNKNOWN"
    registry_custodian: "UNKNOWN"
    independent_validator: "UNKNOWN"
    independent_verifier: "UNKNOWN"
    confirming_authority: "UNKNOWN"
  revision:
    revision_number: 1
    parent_commit: "e845affeebd38f15ee6bc31181d4c707197e3357"
    parent_sha256: "UNKNOWN — exact parent bytes have not been independently retrieved and hashed"
    committed_at_utc: "UNKNOWN — obtain from canonical Git commit metadata"
    committed_by: "UNKNOWN — obtain from canonical Git commit metadata"
    verified_commit: "NOT_YET_VERIFIED"
    content_sha256: "NOT_YET_COMPUTED_FOR_THIS_CANDIDATE"

allocation_protocol:
  sequence:
    - "REQUEST"
    - "RESERVE"
    - "VALIDATE"
    - "COMMIT"
    - "VERIFY"
    - "CONFIRM"
  meanings:
    REQUEST: "A request is recorded; it grants no right to use the identifier as allocated."
    RESERVE: "A temporary reservation may be recorded by the custodian; it is not an allocation."
    VALIDATE: "Check grammar, uniqueness, aliases, scope, evidence, authority and concurrent changes."
    COMMIT: "Commit the validated registry mutation to the canonical repository."
    VERIFY: "An independent verifier checks the exact commit and content SHA-256, schema, uniqueness and evidence."
    CONFIRM: "The recorded confirming authority accepts the verification record and marks the allocation ALLOCATED."
  rules:
    - "No agent or contributor may self-allocate an identifier."
    - "A requested or reserved identifier is not allocated until the canonical registry change is committed, independently verified, and confirmed by the recorded authority."
    - "A commit SHA is necessary traceability evidence but is not sufficient proof of allocation."
    - "All registry mutations must be serialized; stale or concurrent conflicting writes must be rejected."
    - "The full canonical uniqueness key is (DOMAIN, DSEQ, normalized ANCHOR) within the applicable identifier namespace."
    - "Equal anchors in different domains are not collisions; identical full canonical keys in the same namespace are collisions."
    - "Ambiguous legacy aliases must not be used for new records."
    - "Retired identifiers are tombstoned and must never be reused."
    - "If the registry is unavailable, allocation stops; no ungoverned fallback is permitted."
    - "Project identity is stable across document revisions; document versions are recorded as artifacts under that project identity."
    - "A new PROJECT-ID is not created merely because a document version number changes."
    - "If an identifier's grammar or namespace is changed, record a governance decision and migration/alias policy before applying it."

identifier_grammar:
  project_key:
    expression: "BASE-ID + '-' + PROJECT-ID"
    proposed_example: "pbim-framework"
    status: "PROPOSED_NOT_CONFIRMED_BY_GOVERNANCE"
    note: "The requested BASE-ID is 'pbim' and PROJECT-ID is 'framework'; this combination is not allocated yet."
  artifact_id:
    description: "A fully qualified artifact identifier including the allocated project key and canonical section/artifact identifier, according to the adopted PBIM grammar."
    status: "GRAMMAR_REQUIRES_GOVERNANCE_CONFIRMATION"
  canonical_uniqueness_key_fields:
    - "DOMAIN"
    - "DSEQ"
    - "normalized ANCHOR"

requests:
  - request_id: "REQ-PBIM-FRAMEWORK-20261011-01"
    request_type: "PROJECT_KEY"
    base_id: "pbim"
    project_id: "framework"
    requested_value: "pbim-framework"
    status: "REQUESTED_NOT_ALLOCATED"
    project_name: "Project Base Integration Manager — Framework"
    purpose: "Maintain the generic PBIM framework and its reusable lifecycle processes."
    requesting_document:
      filename: "Project_Base_Integration_Manager-v1.12.08.md"
      local_source_sha256: "848146b8ef28f2923491d032952b1df2f786c9af704ebc85aafdf322023edd1c"
      parent_filename: "Project_Base_Integration_Manager-v1.12.07.md"
      parent_local_source_sha256: "100736c72ae330183fb408d518ef1887faa8a07edf7361542f23519e1f3d8661"
      reference_status: "LOCAL_CANDIDATE_HASH_COMPUTED; repository commit not supplied"
    requested_at_utc: "2026-10-11T19:27:30Z"
    requested_by: "UNKNOWN — record the actual requester/authority in the governance record"
    requested_scope: "Stable project identity across PBIM document versions; versioned documents are separate artifacts."
    naming_discrepancy: "Current prompt fields BASE-ID=pbim and PROJECT-ID=framework produce pbim-framework. A prior preference may refer to pbim-generic-framework. H0 must resolve this before validation; do not allocate either value while unresolved."
    review_evidence: []
    reservation:
      status: "NOT_RESERVED"
      reserved_by: "UNKNOWN"
      expires_at_utc: "NOT_APPLICABLE"
    decision_record: "NOT_YET_RECORDED"
    note: >-
      The value was requested in the AEA prompt context. It is not allocated,
      reserved, or approved. Do not use it as a registry-allocated identifier
      in an AEA query until the allocation protocol reaches CONFIRM.

entries: []

aliases: []
retired_identifiers: []

required_allocation_evidence:
  - "Approved request and project identity, with recorded decision authority"
  - "Grammar and namespace decision, including the project-key convention"
  - "Uniqueness and alias-collision validation result against the canonical registry state"
  - "Canonical registry commit SHA and committed content SHA-256"
  - "Independent verification record identifying the exact commit and hash"
  - "Confirmation by the recorded authority"
  - "Audit record showing requester, custodian, validator, verifier and confirmer roles; disclose role overlap and independence limits"

document_version_policy:
  stable_project_identity: "Keep the same project key across PBIM document versions unless a documented governance decision establishes a genuinely distinct project."
  versioned_artifacts:
    filename_pattern: "Project_Base_Integration_Manager-v<MAJOR>.<MINOR>.<PATCH>.md"
    rule: "Each immutable version is a separate artifact record under the stable project key."
  active_version:
    rule: "The newest published file may be designated CURRENT_CANDIDATE or CURRENT_APPROVED_BASELINE; these states are not interchangeable."
    required_fields:
      - "filename"
      - "document_version"
      - "content_sha256"
      - "repository_path"
      - "commit_sha"
      - "lifecycle_status"
  approval_rule: "Publication to the official PBIM version folder does not, by itself, make a candidate an approved baseline."

change_log:
